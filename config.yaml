progress:
  update_in_seconds: 10
  update_in_bytes: 104857600
yt_dlp:
  cookiefile: cookies.txt
  extractor_args:
    youtube:
      player_client:
      - default
      - web_embedded
      - mweb
      - tv
  format: bestvideo[height<=1080]+bestaudio/best[height<=1080]
  live_from_start: true
  max_sleep_interval: 15.0
  noplaylist: true
  noprogress: true
  outtmpl:
    default: ./%(playlist&{}|)s/%(playlist_index&{} - |)s%(title)s - %(channel)s -
      %(release_date>%Y-%m-%d,upload_date>%Y-%m-%d)s [%(id)s].%(ext)s
  paths:
    home: /app/downloads
  postprocessors:
  - api: https://sponsor.ajay.app
    categories: !!set
      preview: null
      selfpromo: null
      sponsor: null
    key: SponsorBlock
    when: after_filter
  - force_keyframes: false
    key: ModifyChapters
    remove_chapters_patterns: []
    remove_ranges: []
    remove_sponsor_segments: !!set
      sponsor: null
    sponsorblock_chapter_title: '[SponsorBlock]: %(category_names)l'
  - add_chapters: true
    add_infojson: if_exists
    add_metadata: true
    key: FFmpegMetadata
  - key: FFmpegConcat
    only_multi_video: true
    when: playlist
  ratelimit: 10485760
  sleep_interval: 5.0
  sleep_interval_requests: 1.0
  sleep_interval_subtitles: 5.0
  verbose: true
